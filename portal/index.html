<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Portal de Compras · Medicinal</title>
<style>
  html,body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){html,body{background:#0f1418;color:#e6ebef}}
  #carga{padding:20vh 16px;text-align:center;color:#5f6b76;font-size:15px}
</style>
</head>
<body>
<!-- Página de entrada estática: o app fica no Supabase formulaCerta (_brasa_parts_compras) e é lido por
     brasa_loader_compras() com a chave anon. Atualizar o portal = publicar no banco; este arquivo não muda. -->
<div id="carga">Carregando o Portal de Compras…</div>
<script>
(function(){
  var API = 'https://mwhlnlqxtudcgbggkqud.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13aGxubHF4dHVkY2diZ2drcXVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NjYyNDgsImV4cCI6MjEwMDI0MjI0OH0.awJmlZnBy4RpTMr1lfL4uIKXmKwm7ItzR9W42BAZRnc';
  var aviso = document.getElementById('carga');
  fetch(API + '/rest/v1/rpc/brasa_loader_compras', {method:'POST', headers:{'apikey':ANON,'Authorization':'Bearer ' + ANON,'Content-Type':'application/json'}, body:'{}', cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(html){
      if(!html) throw new Error('portal vazio');
      var box = document.createElement('div');
      box.innerHTML = html;
      // innerHTML não executa <script>: recria cada um, na ordem, depois de inserir o resto
      var scripts = Array.prototype.slice.call(box.querySelectorAll('script'));
      scripts.forEach(function(s){ s.parentNode.removeChild(s); });
      aviso.remove();
      while(box.firstChild) document.body.appendChild(box.firstChild);
      scripts.forEach(function(s){
        var n = document.createElement('script');
        Array.prototype.forEach.call(s.attributes, function(a){ n.setAttribute(a.name, a.value); });
        n.text = s.textContent;
        document.body.appendChild(n);
      });
    })
    .catch(function(e){ aviso.textContent = 'Não foi possível carregar o Portal de Compras (' + e.message + '). Tente recarregar a página.'; });
})();
</script>
</body>
</html>
